plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'dev.despical'
version = '1.3.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public' }
}

dependencies {
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'

    implementation('dev.despical:commons:2.0.6') {
        exclude group: 'org.slf4j'
    }
    implementation 'dev.despical:command-framework:1.5.9'
    implementation 'org.bstats:bstats-bukkit:3.1.0'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.processResources {
    def props = [version: version]
    inputs.properties props

    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    minimize()

    relocate 'dev.despical.commons', 'dev.despical.pixelpainter.lib.commons'
    relocate 'dev.despical.commandframework', 'dev.despical.pixelpainter.lib.commandframework'
    relocate 'org.bstats', 'dev.despical.pixelpainter.lib.bstats'

    exclude 'META-INF/**'

    archiveFileName = "pixel-painter-${version}.jar"
}
