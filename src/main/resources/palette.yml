  BAMBOO_MOSAIC: '#BEAA4E'
  BAMBOO_PLANKS: '#C1AD50'
  BASALT: '#49494E'
  BEDROCK: '#555555'
  BIRCH_LEAVES: '#42542B'
  BIRCH_LOG: '#D9D7D2'
  BIRCH_PLANKS: '#C0AF79'
  BIRCH_WOOD: '#D9D7D2'
  BLACKSTONE: '#2A2429'
  BLACK_CONCRETE: '#080A0F'
  BLACK_GLAZED_TERRACOTTA: '#441E20'
  BLACK_TERRACOTTA: '#251710'
