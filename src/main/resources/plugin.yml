name: PixelPainter
author: Despical
version: ${project.version}
description: ${project.description}
main: me.despical.pixelpainter.Main

api-version: 1.13

permissions:
  pp.*:
    default: op
    children:
      pp.create: true
      pp.delete: true
      pp.undo: true
      pp.list: true
      pp.help: true
      pp.download: true
      pp.howmanyblocks: true