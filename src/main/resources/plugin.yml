name: PixelPainter
author: Despical
version: ${version}
api-version: 1.13
description: Turn your images into Minecraft blocks.
main: dev.despical.pixelpainter.PixelPainterPlugin

permissions:
  pp.*:
    default: op
    children:
      pp.create: true
      pp.delete: true
      pp.undo: true
      pp.list: true
      pp.help: true
      pp.download: true
      pp.howmanyblocks: true
