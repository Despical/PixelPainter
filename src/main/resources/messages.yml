# Chat panels, hover text and progress labels use Adventure MiniMessage.
# Reload with /pp reload after editing. Invalid YAML, non-text values or malformed
# MiniMessage tags reject the reload and keep the previous message set active.
# Missing keys fall back to the bundled defaults, so you may override single keys.
#
# Placeholders such as {image}, {id} and {blocks} are inserted as literal text.
# Rich placeholders such as {command}, {previous} and {next} are supplied by the
# panel renderer. Keep required placeholders when you edit a message.
# A key with a "-title" companion is shown to players as a centered panel;
# the console receives the same text without formatting.

# Shared chat layout
chat.separator: '<#394555><strikethrough>                                                                        </strikethrough></#394555>'
chat.table-row-prefix: '  <#606A7B>•</#606A7B> '
chat.button-previous: '[Previous]'
chat.button-next: '[Next]'
chat.hover-previous: '<#7ABFCC>Click to open the previous page.</#7ABFCC>'
chat.hover-next: '<#7ABFCC>Click to open the next page.</#7ABFCC>'
chat.page-navigation: '{previous}  <#A8B8C9>{page} / {pages}</#A8B8C9>  {next}'
chat.help-button: '<#7ABFCC>[Command help]</#7ABFCC>'
chat.help-hover: '<#7ABFCC>Click to fill in /pp help.</#7ABFCC>'
chat.error-help-button: '<#A96B66>[</#A96B66><#E39A90>Command help</#E39A90><#A96B66>]</#A96B66>'
chat.error-help-hover: '<#C8847E>Click to fill in <#F2B2A8>/pp help</#F2B2A8>.</#C8847E>'
chat.confirm-button: '<#7ABFCC>[Paint anyway]</#7ABFCC>'
chat.confirm-hover: '<#7ABFCC>Click to paint past the world border.</#7ABFCC>'
chat.undo-button: '<#7ABFCC>[Undo]</#7ABFCC>'
chat.undo-hover: '<#7ABFCC>Click to fill in /pp undo {id}.</#7ABFCC>'

# Help panel
commands.help-title: '<#DCE3EE><bold>PixelPainter Commands</bold></#DCE3EE>'
commands.help-subtitle: '<#A8B8C9>Hover for details. Click a command to fill it in.</#A8B8C9>'
commands.help-section: '  <#8AADD3>{section}</#8AADD3>'
commands.help-group-paint: 'Paint & estimate'
commands.help-group-images: 'Images & history'
commands.help-group-manage: 'Manage'
commands.help-group-reference: 'Reference'
commands.help-command: '<#91D7E3>{command}</#91D7E3>'
commands.help-row: '  <#606A7B>•</#606A7B> {command} <#606A7B>·</#606A7B> <#B8C2D4>{description}</#B8C2D4>'
commands.help-hover: '<#91D7E3>{command}</#91D7E3><newline><newline><#B8C2D4>{description}</#B8C2D4><newline><newline><#7ABFCC>Click to fill in this command.</#7ABFCC>'
commands.help-desc-create: 'Paint an image'
commands.help-detail-create: 'Start at your current block position, the bottom-left corner. Height is the exact number of block rows. Transparent pixels preserve terrain.'
commands.help-desc-preview: 'Estimate blocks and materials'
commands.help-detail-preview: 'Calculate the same dimensions, transparency and color matching as create, without changing the world. This is a material estimate, not an in-world preview. /pp howmanyblocks is an alias.'
commands.help-desc-undo: 'Restore original terrain'
commands.help-detail-undo: 'Restore the latest accessible painting, or choose a journal ID or source image. Only blocks still matching the painting are restored. Journals survive server restarts.'
commands.help-desc-cancel: 'Stop your current operation'
commands.help-detail-cancel: 'Stop image planning or the running world job. Already placed blocks remain available through persistent undo. Downloads and file deletion must finish before they can be cleared.'
commands.help-desc-list: 'Browse source images'
commands.help-detail-list: 'List PNG, JPEG and WebP files in plugins/PixelPainter/images. Click a row to fill in a create command.'
