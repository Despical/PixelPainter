commands.help-group-paint: 'Paint & estimate'
commands.help-group-images: 'Images & history'
commands.help-group-manage: 'Manage'
commands.help-group-reference: 'Reference'
commands.help-command: '<#91D7E3>{command}</#91D7E3>'
commands.help-row: '  <#606A7B>•</#606A7B> {command} <#606A7B>·</#606A7B> <#B8C2D4>{description}</#B8C2D4>'
commands.help-hover: '<#91D7E3>{command}</#91D7E3><newline><newline><#B8C2D4>{description}</#B8C2D4><newline><newline><#7ABFCC>Click to fill in this command.</#7ABFCC>'
commands.help-desc-create: 'Paint an image'
commands.help-detail-create: 'Start at your current block position, the bottom-left corner. Height is the exact number of block rows. Transparent pixels preserve terrain.'
commands.help-desc-preview: 'Estimate blocks and materials'
commands.help-detail-preview: 'Calculate the same dimensions, transparency and color matching as create, without changing the world. This is a material estimate, not an in-world preview. /pp howmanyblocks is an alias.'
commands.help-desc-undo: 'Restore original terrain'
commands.help-detail-undo: 'Restore the latest accessible painting, or choose a journal ID or source image. Only blocks still matching the painting are restored. Journals survive server restarts.'
commands.help-desc-cancel: 'Stop your current operation'
commands.help-detail-cancel: 'Stop image planning or the running world job. Already placed blocks remain available through persistent undo. Downloads and file deletion must finish before they can be cleared.'
commands.help-desc-list: 'Browse source images'
commands.help-detail-list: 'List PNG, JPEG and WebP files in plugins/PixelPainter/images. Click a row to fill in a create command.'

commands.help-desc-specs: 'Inspect source dimensions'
commands.help-detail-specs: 'Read the original image width and height in pixels. /pp info is an alias.'
commands.help-desc-history: 'Browse undo journals'
commands.help-detail-history: 'Browse your persistent painting records. Administrators with pp.admin can also see records of other players. Click a row to fill in its undo command.'
commands.help-desc-materials: 'Browse supported blocks'
commands.help-detail-materials: 'View supported block colors, filtered by all, concrete, wool or terracotta. Edit palette.yml to add more colors.'
commands.help-desc-download: 'Download a source image'
commands.help-detail-download: 'Download a PNG, JPEG or WebP from a configured trusted HTTPS host. Files are size-limited and decoded before saving. Existing files are never replaced.'
commands.help-desc-delete: 'Delete a source image'
commands.help-detail-delete: 'Remove an image file from the images folder. Existing paintings and their undo journals remain available.'
commands.help-desc-reload: 'Reload configuration'
commands.help-detail-reload: 'Validate and reload config.yml, messages.yml and palette.yml together. Invalid input keeps the previous active settings. Existing jobs retain their limits and colors.'
commands.help-desc-help: 'View command help'
commands.help-detail-help: 'Show the commands available to you. /pp opens this page too.'

